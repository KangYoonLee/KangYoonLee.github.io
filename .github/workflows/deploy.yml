name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install CollectiveScope fork dependencies
        run: npm ci --no-audit --no-fund
        working-directory: client/collective-dcn-src

      - name: Build CollectiveScope fork
        run: npm run build
        working-directory: client/collective-dcn-src

      - name: Copy CollectiveScope into Pages output
        run: |
          mkdir -p dist/public/collectives
          cp -R client/collective-dcn-src/dist/. dist/public/collectives/
          cp client/collective-dcn-src/LICENSE dist/public/collectives/LICENSE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
